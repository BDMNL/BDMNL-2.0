faq:
  - id: 1
    question: "Wat valt onder online marketing in Delft?"
    answer: >
      Online marketing kan bestaan uit SEO, content, campagnes, social media
      en conversieverbetering. BDMNL kijkt vooral naar de samenhang tussen die
      kanalen en je website.

  - id: 2
    question: "Kan BDMNL helpen met lokale zichtbaarheid?"
    answer: >
      Ja. We kijken naar zoekgedrag in Delft, relevante diensten en lokale
      context. Daarna versterken we pagina's en content die passen bij je
      doelgroep.

  - id: 3
    question: "Werken campagnes beter met een goede website?"
    answer: >
      Ja. Campagnes sturen bezoekers naar je website. Als die pagina niet
      duidelijk, snel of overtuigend is, gaat veel waarde verloren.

  - id: 4
    question: "Is online marketing geschikt voor kleinere bedrijven?"
    answer: >
      Zeker. Juist kleinere bedrijven hebben baat bij focus. We kiezen de
      kanalen en acties die passen bij je markt, budget en groeifase.

  - id: 5
    question: "Hoe meten jullie resultaat?"
    answer: >
      We kijken naar zichtbaarheid, verkeer, aanvragen en gedrag op de website.
      De rapportage blijft praktisch, zodat je weet welke stappen waardevol zijn.
