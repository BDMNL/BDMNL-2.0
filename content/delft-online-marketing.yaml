sections:
  - id: 1
    h2: "Een complete online marketingstrategie voor Delft"
    p: >
      Online marketing is meer dan een Facebook-advertentie of een Google-campagne.
      Het is het geheel van kanalen, boodschappen en timing dat jouw ideale
      klant in Delft op het juiste moment bereikt. BDMNL ontwikkelt een
      strategie op maat — gebaseerd op data, jouw markt en jouw doelen.
      Van bewustwording tot conversie, wij begeleiden de hele funnel.

  - id: 2
    h2: "Google Ads die direct resultaat leveren"
    p: >
      SEO duurt maanden. Google Ads geeft direct zichtbaarheid voor de
      zoekopdrachten die tellen. BDMNL beheert Google Ads-campagnes voor
      bedrijven in Delft met focus op rendement: lage kosten per lead,
      hoge conversieratio en maximale return on ad spend. We bouwen en
      optimaliseren campagnes die elke euro verantwoorden.

  - id: 3
    h2: "Social media marketing die converteert"
    p: >
      Social media is niet voor iedereen even relevant — maar voor de
      bedrijven in Delft waarvoor het werkt, werkt het uitstekend.
      BDMNL beheert social media campagnes op LinkedIn, Instagram en
      Facebook die niet alleen bereik genereren, maar ook daadwerkelijk
      leads en verkopen opleveren. Gerichte targeting op jouw doelgroep
      in Delft en de regio.

