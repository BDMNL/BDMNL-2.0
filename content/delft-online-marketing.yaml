faq:
  - id: 1
    question: "Wat kost online marketing voor een bedrijf in Delft?"
    answer: >
      Online marketingkosten variëren sterk op basis van kanalen, doelstellingen
      en advertentiebudget. BDMNL werkt met transparante maandelijkse pakketten
      en geeft altijd een gedetailleerde offerte op maat. We bespreken eerlijk
      wat realistisch is voor jouw budget en doelen in Delft.

  - id: 2
    question: "Welke online marketingkanalen zijn het meest effectief voor Delft?"
    answer: >
      Dat hangt af van jouw branche en doelgroep. Voor B2B-bedrijven in Delft
      is LinkedIn vaak zeer effectief, gecombineerd met SEO en content.
      Voor B2C-bedrijven werkt Google Ads en Instagram goed. BDMNL analyseert
      jouw markt en adviseert de meest rendabele mix voor jouw situatie.

  - id: 3
    question: "Combineert BDMNL SEO met online marketing?"
    answer: >
      Ja, absoluut. SEO en online marketing versterken elkaar. Een goede
      SEO-basis zorgt voor structureel organisch verkeer, terwijl Google
      Ads direct bereik geeft. BDMNL integreert beide in een samenhangende
      strategie zodat jij het meeste uit jouw marketingbudget haalt.

  - id: 4
    question: "Hoe snel zie ik resultaat van online marketing in Delft?"
    answer: >
      Google Ads levert direct resultaat zodra de campagne live gaat.
      SEO en content marketing vragen meer tijd — doorgaans 3 tot 6 maanden
      voor zichtbare verbeteringen. Social media campagnes leveren binnen
      weken meetbare betrokkenheid. We zijn transparant over verwachtingen
      en rapporteren maandelijks.

  - id: 5
    question: "Rapporteert BDMNL over online marketingresultaten?"
    answer: >
      Ja. Elke maand ontvang je een helder rapport met de prestaties per
      kanaal: verkeer, leads, conversies, advertentieresultaten en SEO-posities.
      We bespreken de resultaten, analyseren wat werkt en passen de strategie
      aan waar nodig. Transparantie is voor ons geen extra service — het is standaard.
