intro:
  p1: >
    Jouw bedrijf in Rotterdam verdient een website die indruk maakt, snel laadt
    en bezoekers omzet in klanten. BDMNL ontwerpt en bouwt premium websites
    die werken — voor ondernemers die geen genoegen nemen met middelmatig.
  p2: >
    We werken voor bedrijven in Rotterdam die begrijpen dat een website niet
    een kostenpost is, maar een investering. Van een strakke zakelijke site tot
    een volledig gepersonaliseerde webshop — wij leveren altijd scherp,
    doordacht en op tijd.

# ------------------------------------------------------------
# CONTENT SECTIONS — 3 required
# ------------------------------------------------------------
sections:
  - id: 1
    h2: "Websites die verkopen voor jouw Rotterdamse bedrijf"
    p: >
      Een mooie website is mooi. Een website die converteert is waardevol.
      Bij BDMNL combineren we beide. We ontwerpen elke pagina met één doel:
      de bezoeker laten doen wat jij wilt. Of dat nu een offerte aanvragen is,
      bellen, inschrijven of kopen — elk element is bewust geplaatst.
      Jouw website wordt een strategisch instrument, geen digitale brochure.

  - id: 2
    h2: "Technisch perfect — snel, veilig en mobielvriendelijk"
    p: >
      Een trage website kost je klanten. Google straft hem af, bezoekers
      verlaten hem, en jij mist omzet. Elke website die BDMNL bouwt is
      geoptimaliseerd voor snelheid, veiligheid en mobile-first gebruik.
      We bouwen op bewezen technologie, met schone code, SSL-certificaten,
      correcte meta-structuur en technische SEO als standaard onderdeel —
      niet als betaalde optie.

  - id: 3
    h2: "Lokale expertise, Rotterdam begrijpen"
    p: >
      Rotterdam is geen gewone stad. Het is de zakelijkste, meest
      vooruitstrevende stad van Nederland. Bedrijven hier willen iets
      zeggen — en ze willen dat hun digitale aanwezigheid dat weerspiegelt.
      BDMNL werkt met Rotterdamse ondernemers die klaar zijn om door te
      groeien. We kennen de markt, we begrijpen de ambitie en we bouwen
      websites die bij die energie passen.

