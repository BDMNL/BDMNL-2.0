# ------------------------------------------------------------
# FAQ — 5 required
# ------------------------------------------------------------
faq:
  - id: 1
    question: "Wat kost een professionele website in Rotterdam?"
    answer: >
      De kosten voor een professionele website variëren sterk op basis van
      omvang, functionaliteiten en maatwerk. Een zakelijke website bij BDMNL
      start vanaf een vast bedrag dat op aanvraag beschikbaar is. We zijn
      transparant over prijzen en leveren altijd een gedetailleerde offerte
      voordat we starten.

  - id: 2
    question: "Hoe lang duurt het bouwen van een website?"
    answer: >
      Een standaard zakelijke website is gemiddeld binnen 3 tot 5 weken
      gereed. Voor complexere projecten zoals webshops of maatwerk platforms
      rekenen we 6 tot 10 weken. We stemmen de planning altijd af in de
      briefing en houden ons aan gemaakte afspraken.

  - id: 3
    question: "Bouwt BDMNL ook webshops in Rotterdam?"
    answer: >
      Ja. BDMNL bouwt zowel zakelijke websites als volledig functionele
      webshops voor Rotterdamse ondernemers. We werken met bewezen
      e-commerce oplossingen die schaalbaar zijn en goed converteren.
      Vraag een gesprek aan om de mogelijkheden te bespreken.

  - id: 4
    question: "Is mijn website vindbaar in Google na oplevering?"
    answer: >
      Elke website die BDMNL bouwt is technisch SEO-proof bij oplevering.
      Dat betekent: correcte meta-structuur, snelle laadtijden, mobiel-vriendelijk,
      schema-markup en schone URL-structuur. Voor verdere Google-vindbaarheid
      bieden we aanvullende SEO-diensten aan op basis van jouw doelstellingen.

  - id: 5
    question: "Kan ik mijn website zelf beheren na oplevering?"
    answer: >
      Ja. We leveren elke website op met een gebruiksvriendelijk CMS waarmee
      jij zelfstandig teksten, afbeeldingen en pagina's kunt aanpassen.
      We geven een korte training bij oplevering en zijn bereikbaar voor
      vragen. Wil je dat wij het beheer overnemen? Dat is ook mogelijk.
