faq:
  - id: 1
    question: "Wat kost SEO in Rotterdam?"
    answer: >
      SEO-kosten variëren sterk op basis van concurrentie, doelstellingen
      en de huidige staat van jouw website. BDMNL werkt met transparante
      maandelijkse pakketten en vaste projectprijzen. We leveren altijd
      een gedetailleerde offerte op maat. Vraag een gratis analyse aan
      voor een eerlijk beeld van wat nodig is.

  - id: 2
    question: "Hoe lang duurt het voordat SEO resultaat oplevert?"
    answer: >
      SEO is een langetermijninvestering. De eerste meetbare verbeteringen
      zijn doorgaans zichtbaar na 3 tot 6 maanden. Structurele, stabiele
      posities in Google bereiken we gemiddeld na 6 tot 12 maanden
      consistente werkzaamheden. We zijn altijd eerlijk over verwachtingen
      en rapporteren maandelijks over de voortgang.

  - id: 3
    question: "Werkt BDMNL ook voor lokale bedrijven in Rotterdam?"
    answer: >
      Zeker. Lokale SEO is een van onze specialisaties. We optimaliseren
      Google Business Profiles, bouwen lokale landingspagina's en zorgen
      dat jouw bedrijf verschijnt in de lokale zoekresultaten in Rotterdam
      en omliggende gebieden zoals Schiedam, Capelle aan den IJssel
      en Vlaardingen.

  - id: 4
    question: "Wat is het verschil tussen SEO en Google Ads?"
    answer: >
      Google Ads geeft direct resultaat maar stopt zodra je budget op is.
      SEO bouwt organische zichtbaarheid op die blijvend is. De combinatie
      van beide levert de sterkste resultaten. BDMNL adviseert welke
      aanpak het beste past bij jouw doelstellingen en budget in Rotterdam.

  - id: 5
    question: "Rapporteert BDMNL over SEO-resultaten?"
    answer: >
      Ja. Elke maand ontvang je een helder rapport met de belangrijkste
      KPI's: posities per zoekwoord, organisch verkeer, conversies en
      technische voortgang. We bespreken de resultaten en de planning
      voor de volgende maand. Transparantie is voor ons geen optie,
      maar standaard.
