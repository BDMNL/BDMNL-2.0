sections:
  - id: 1
    h2: "Technische SEO die Google begrijpt"
    p: >
      De basis van elke succesvolle SEO-strategie is technisch perfect. We
      beginnen met een grondige audit van jouw website: laadsnelheid, Core
      Web Vitals, crawlbaarheid, indexering, structuurdata en mobiele
      optimalisatie. Zonder sterke technische basis heeft geen enkele
      contentstrategie zin. BDMNL lost de techniek op voordat we verder gaan.

  - id: 2
    h2: "Lokale SEO voor Rotterdamse zoekopdrachten"
    p: >
      'SEO bureau Rotterdam', 'webdesign bedrijf Rotterdam', 'accountant
      Rotterdam centrum' — dit zijn de zoekopdrachten die jouw klanten
      gebruiken. We optimaliseren jouw Google Business Profile, bouwen
      lokale landingspagina's en zorgen dat jij verschijnt waar jouw
      klanten in Rotterdam zoeken. Lokale SEO is specialistenwerk en
      BDMNL doet het structureel goed.

  - id: 3
    h2: "Contentstrategie die rankt en converteert"
    p: >
      Content is de brandstof van SEO. Maar niet élke content rankt.
      BDMNL ontwikkelt een gerichte contentstrategie op basis van
      zoekwoordenonderzoek, concurrentieanalyse en jouw bedrijfsdoelen.
      We schrijven content die Google vertrouwt en bezoekers overtuigt —
      voor jouw branche in Rotterdam en de regio.

