sections:
- id: 1
  h2: Branding en design die past bij jouw bedrijf in Goes
  p: Goes heeft een eigen zakelijke dynamiek. Als ondernemer wil je online professioneel overkomen en vertrouwen wekken bij klanten in de regio. BDMNL zorgt voor een duidelijke basis die past bij je doelgroep en ambities.
- id: 2
  h2: Technisch sterk, snel en betrouwbaar
  p: Een moderne digitale basis moet technisch kloppen. We bouwen met aandacht voor snelheid, veiligheid, mobiel gebruik, structuur en vindbaarheid, zodat jouw bedrijf in Goes klaar is voor groei.
- id: 3
  h2: Lokale zichtbaarheid in Goes en omgeving
  p: Je online aanwezigheid moet aansluiten op de markt. Daarom verwerken we lokale context rond Goes op een natuurlijke manier, zonder keyword stuffing of generieke SEO-teksten.
