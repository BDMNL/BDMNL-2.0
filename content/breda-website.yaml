faq:
- id: 1
  question: Wat kost website laten maken in Breda?
  answer: De kosten hangen af van omvang, doelen en gewenste functionaliteiten. BDMNL maakt vooraf een duidelijke offerte op maat, zodat je weet wat nodig is voor jouw bedrijf in Breda.
- id: 2
  question: Werkt BDMNL voor lokale bedrijven in Breda?
  answer: Ja. We werken voor lokale ondernemers en MKB-bedrijven die online professioneler willen overkomen. Daarbij nemen we de markt in Breda en omgeving mee in structuur, tekst en vindbaarheid.
