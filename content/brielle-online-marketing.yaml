sections:
- id: 1
  h2: Online marketing met lokale focus
  p: Brielle heeft een lokale markt waarin vertrouwen en herkenbaarheid belangrijk zijn. We zorgen dat jouw bedrijf zichtbaar wordt op de plekken waar klanten zoeken, vergelijken en besluiten contact op te nemen.
- id: 2
  h2: SEO, content en campagnes in één lijn
  p: Campagnes werken beter wanneer de website klopt. BDMNL verbindt SEO, content en advertenties met duidelijke landingspagina’s, zodat bezoekers begrijpen wat je aanbiedt en waarom ze voor jou kiezen.
- id: 3
  h2: Meetbaar groeien zonder ruis
  p: We kijken naar verkeer, aanvragen, zichtbaarheid en gedrag op de website. Zo zie je welke kanalen waarde opleveren en waar verbetering nodig is voor groei in Brielle en omgeving.
