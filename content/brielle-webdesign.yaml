faq:
  - id: 1
    question: "Wat kost een website laten maken in Brielle?"
    answer: >
      De prijs voor een professionele website hangt af van omvang en functionaliteiten.
      Een zakelijke website bij BDMNL start vanaf een vast tarief dat op aanvraag
      beschikbaar is. We zijn volledig transparant over kosten en leveren altijd
      een gedetailleerde offerte op maat voordat we beginnen.

  - id: 2
    question: "Maakt BDMNL ook websites voor kleine bedrijven in Brielle?"
    answer: >
      Zeker. We werken voor bedrijven van alle groottes — van eenmanszaken en
      lokale winkeliers tot grotere MKB-bedrijven in de regio Voorne-Putten.
      Elk bedrijf verdient een goede website, ongeacht de schaal.

  - id: 3
    question: "Hoe snel is mijn nieuwe website online?"
    answer: >
      Een standaard zakelijke website is gemiddeld binnen 3 tot 5 weken
      gereed na goedkeuring van het ontwerp. We werken met een heldere planning
      en houden je gedurende het gehele traject op de hoogte van de voortgang.

  - id: 4
    question: "Is mijn website vindbaar in Google na oplevering?"
    answer: >
      Elke website die wij bouwen wordt technisch geoptimaliseerd voor zoekmachines.
      Dat betekent correcte meta-tags, snelle laadtijden, mobiel-vriendelijk ontwerp
      en schema-markup. Voor verdere lokale zichtbaarheid in Brielle bieden we
      aanvullende SEO-diensten aan op basis van jouw doelstellingen.

  - id: 5
    question: "Kan ik mijn website na oplevering zelf aanpassen?"
    answer: >
      Ja. We leveren elke website op met een gebruiksvriendelijk CMS zodat jij
      zelf teksten en afbeeldingen kunt aanpassen. Bij oplevering geven we een
      korte training en we staan klaar voor vragen. Wil je dat wij het beheer
      overnemen? Dat bespreken we graag.
