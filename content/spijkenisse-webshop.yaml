faq:
  - id: 1
    question: "Wat kost een webshop laten maken in Spijkenisse?"
    answer: >
      De kosten voor een webshop variëren sterk op basis van het aantal
      producten, gewenste functionaliteiten en integraties. Een startende
      webshop bij BDMNL begint vanaf een vast tarief dat op aanvraag
      beschikbaar is. We leveren altijd een gedetailleerde offerte op maat
      voordat we starten.

  - id: 2
    question: "Hoe lang duurt het bouwen van een webshop?"
    answer: >
      Een standaard webshop is gemiddeld binnen 4 tot 6 weken gereed na
      goedkeuring van het ontwerp en aanlevering van producten en content.
      Voor complexere webshops met maatwerk integraties rekenen we 6 tot
      10 weken. We werken met een heldere planning en houden ons aan afspraken.

  - id: 3
    question: "Welk platform gebruikt BDMNL voor webshops?"
    answer: >
      We werken met bewezen e-commerce platforms die schaalbaar en beheervriendelijk
      zijn. De keuze van platform hangt af van jouw situatie, doelstellingen en
      budget. Tijdens het intakegesprek bespreken we welk platform het beste past
      bij jouw webshop in Spijkenisse.

  - id: 4
    question: "Is mijn webshop vindbaar in Google na oplevering?"
    answer: >
      Elke webshop die BDMNL bouwt is technisch SEO-proof bij oplevering.
      Dat betekent correcte productstructuur, snelle laadtijden, mobiel-vriendelijk
      ontwerp, canonical-tags en schema-markup voor producten. Voor verdere
      Google-zichtbaarheid bieden we aanvullende SEO-diensten aan.

  - id: 5
    question: "Kan ik mijn bestaande webshop laten verbeteren?"
    answer: >
      Ja. Naast het bouwen van nieuwe webshops helpt BDMNL ook bij het
      optimaliseren van bestaande webshops. We analyseren conversieknelpunten,
      laadsnelheid, gebruikerservaring en SEO-prestaties en pakken de
      verbeterpunten aan die het meeste impact hebben.
