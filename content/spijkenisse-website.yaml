faq:
- id: 1
  question: Wat kost website laten maken in Spijkenisse?
  answer: De kosten hangen af van omvang, doelen en gewenste functionaliteiten. BDMNL maakt vooraf een duidelijke offerte op maat, zodat je weet wat nodig is voor jouw bedrijf in Spijkenisse.
- id: 2
  question: Werkt BDMNL voor lokale bedrijven in Spijkenisse?
  answer: Ja. We werken voor lokale ondernemers en MKB-bedrijven die online professioneler willen overkomen. Daarbij nemen we de markt in Spijkenisse en omgeving mee in structuur, tekst en vindbaarheid.
