sections:
- id: 1
  h2: Een website die past bij jouw bedrijf in Delft
  p: Delft heeft een eigen zakelijke dynamiek. Als ondernemer wil je een website die professioneel voelt, snel laadt en vertrouwen wekt bij klanten uit Binnenstad, TU Delft en Voorhof. BDMNL bouwt websites die niet alleen goed ogen, maar ook logisch sturen op aanvragen en groei.
- id: 2
  h2: Technisch sterk, snel en mobielvriendelijk
  p: Een moderne website moet technisch kloppen. We bouwen met aandacht voor snelheid, veiligheid, mobiel gebruik, duidelijke structuur en technische SEO. Zo krijgt jouw bedrijf in Delft een online basis die betrouwbaar voelt en goed kan doorgroeien.
- id: 3
  h2: Lokale zichtbaarheid in Delft en omgeving
  p: Een website moet aansluiten op je markt. Daarom verwerken we lokale context rond Delft, Binnenstad, TU Delft en Voorhof en de bredere regio Zuid-Holland op een natuurlijke manier. Geen keyword stuffing, maar content die bezoekers en Google helpt begrijpen waar je relevant bent.
